# Proxy LiteLLM: una sola puerta de entrada a la IA, con los modelos
# declarados en litellm_config.yaml.
#
#   docker compose up -d      arrancar
#   docker compose logs -f    ver qué pasa
#   docker compose down       parar
#
# Las claves salen de backend/.env, así que no se duplican aquí.

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: redactor-ia-litellm
    restart: unless-stopped
    ports:
      - '4000:4000'
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - backend/.env
    command: ['--config', '/app/config.yaml', '--port', '4000']
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:4000/health/liveliness || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
