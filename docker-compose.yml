# Proxy LiteLLM: una sola puerta de entrada a la IA, con los modelos
# declarados en litellm_config.yaml.
#
#   docker compose up -d      arrancar
#   docker compose logs -f    ver qué pasa
#   docker compose down       parar
#
# Las claves salen de backend/.env, así que no se duplican aquí.

services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    container_name: redactor-ia-litellm
    restart: unless-stopped
    ports:
      - '4000:4000'
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    env_file:
      - backend/.env
    command: ['--config', '/app/config.yaml', '--port', '4000']
    healthcheck:
      # Con python, no con curl: la imagen no trae curl y el contenedor se
      # quedaba marcado como "unhealthy" aunque el proxy respondiera bien.
      test:
        [
          'CMD',
          'python3',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://localhost:4000/health/liveliness", timeout=4)',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
